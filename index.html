<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  
  <section id="start">
    <div class="logo" aria-hidden="true">&lt;/&gt;</div>
    <h1 class="title">Computer Quiz</h1>
    <p class="sub">Computers, science, maths and general knowledge</p>
    <p id="ask" class="ask"></p>

    <div id="first" class="choices">
      <button id="yes" type="button" class="play">Yes, let's play!</button>
      <button id="no" type="button" class="ghost">Not now</button>
    </div>
    <p id="nomsg" class="nomsg" aria-live="polite"></p>

    
    <div id="setup" hidden>
      <p class="label">How many questions?</p>
      <div id="counts" class="chips"></div>

      <label class="label" for="subject">Subject</label>
      <select id="subject"></select>

      <button id="begin" type="button" class="wide">Start quiz</button>
    </div>

    <p class="author">Created by Yatin</p>
  </section>

 
  <div id="hud" hidden>
    <div class="top"><span id="count"></span><span id="score-live">Score: 0</span></div>
    <div class="bar"><div id="fill"></div></div>
  </div>

 
  <section id="quiz" hidden>
    <h1 id="q"></h1>
    <div id="opts"></div>
    <p id="fb" aria-live="polite"></p>
    <button id="go" type="button" hidden>next question</button>
  </section>

 
  <section id="result" hidden>
    <p id="summary"></p>
    <p id="pct"></p>
    <p id="msg"></p>
    <p class="label">Score by subject</p>
    <ul id="by"></ul>
    <div class="row">
      <button id="again" type="button">play again</button>
      <button id="menu" type="button" class="ghost">change settings</button>
    </div>
    <p class="author">Created by Yatin</p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
